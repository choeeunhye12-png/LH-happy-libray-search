<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LH행복마을작은도서관 자료검색</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#111827;
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{max-width:980px;margin:0 auto;padding:28px 16px 60px;}
    h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-0.2px;}
    .sub{margin:0 0 16px;color:var(--muted);font-size:14px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
    .field{display:flex;flex-direction:column;gap:6px;min-width:160px;flex:1;}
    label{font-size:12px;color:var(--muted);}
    select,input{height:40px;border-radius:10px;border:1px solid var(--line);padding:0 12px;font-size:14px;}
    .btn{height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;}
    .help{margin-top:10px;font-size:13px;color:var(--muted);}
    table{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#fff;}
    thead th{text-align:left;font-size:13px;background:#f9fafb;padding:12px;border-bottom:1px solid var(--line);}
    tbody td{padding:12px;border-bottom:1px solid var(--line);font-size:14px;}
    tbody tr:last-child td{border-bottom:0}
    .empty{padding:18px;color:var(--muted);text-align:center;}
    .footerLinks{margin-top:18px;display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);}
    .footerLinks a{color:inherit;text-decoration:none;}
    .footerLinks a:hover{text-decoration:underline;}
  </style>
</head>

<body>
  <div class="wrap">
    <h1>LH행복마을작은도서관 자료검색</h1>
    <p class="sub">우리 도서관에 소장된 도서를 간편하게 검색해 보세요.</p>

    <div class="card">
      <div class="controls">
        <div class="field" style="max-width:220px;">
          <label for="target">검색 대상</label>
          <select id="target">
  <option value="all" selected>전체(통합검색)</option>
  <option value="title">도서명</option>
  <option value="author">저자</option>
  <option value="publisher">출판사</option>
  <option value="callno">청구기호</option>
</select>
        </div>

        <div class="field">
          <label for="q">검색어</label>
          <input id="q" type="text" placeholder="도서명 또는 저자를 입력해 주세요" />
        </div>

        <button class="btn" id="searchBtn" type="button">검색</button>
      </div>

      <div class="help" id="hint">
        검색 결과: 0권 · 도서명, 저자, 출판사로 검색할 수 있습니다.
      </div>

      <table>
        <thead>
          <tr>
            <th>서명</th>
            <th>저자</th>
            <th>출판사</th>
            <th>청구기호</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr>
            <td class="empty" colspan="4">
              도서명 또는 저자를 입력한 후 [검색] 버튼을 눌러주세요.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footerLinks">
      <a href="#" onclick="alert('인스타그램 링크를 연결해 주세요.');return false;">LH행복마을작은도서관 인스타그램</a>
      <a href="#" onclick="alert('밴드 링크를 연결해 주세요.');return false;">LH행복마을작은도서관 밴드</a>
    </div>
  </div>

  <!-- ✅ script.js 연결 -->
  <script src="./script.js"></script>
</body>
</html>
